# Builds the package and runs its tests on every push to main and every pull
# request. Apps pin AgentsMate to a commit on main, and their sync workflows
# move the pin only after this repository's main has passed here.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select newest Xcode 26
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"

      - name: Build
        run: |
          swift build -c release
          swift build -c release --product agentsmate-status

      - name: Test
        run: swift test
